[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abundera-qr-pro"
version = "0.1.0"
description = "Official Python SDK for Abundera QR Pro — dynamic QR codes, analytics, webhooks."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abundera, Inc.", email = "hello@abundera.ai" }]
requires-python = ">=3.9"
keywords = ["qr", "qr-code", "dynamic-qr", "abundera", "analytics", "webhooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://pro.qr.abundera.ai/docs/"
Documentation = "https://pro.qr.abundera.ai/docs/"
Repository = "https://github.com/abundera/qr-pro-sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["abundera_qr_pro"]
